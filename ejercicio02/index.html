<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let cliente = prompt("Cual es tu nombre?")
        let precioCompra = Number(prompt("Introduce el precio de tu compra aqui."))
        let precioFinal

        if (precioCompra >= 100) {
            precioFinal = precioCompra - (precioCompra * 0.10)
        } else {
            precioFinal = precioCompra;
        }
        alert("Cliente: " + cliente + " - Precio final: " + precioFinal + "€");
    </script>
</body>

</html>
