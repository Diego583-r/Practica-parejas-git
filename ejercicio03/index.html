<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        const NUMERO_SECRETO = 6;

        let numeroUsuario = Number(prompt("Introduzca aqui un numero del 1 al 10"))

        if (numeroUsuario === NUMERO_SECRETO) {
            alert("Has acertado al numero secreto!");
        }else if (numeroUsuario > NUMERO_SECRETO){
            alert("El numero secreto es mas pequeño");
        } else{
         alert("El numero es mas grande")
        }
            


    </script>
</body>

</html>
